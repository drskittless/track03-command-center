[project]
name = "kbc-vibeathon"
version = "0.1.0"
description = "KBC Vibeathon monorepo"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "notion-client",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
